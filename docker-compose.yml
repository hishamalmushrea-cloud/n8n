# n8n AI Dev Team - Self-Hosted Stack
# يشغل: n8n + Postgres + Redis (Queue Mode) + Browserless (للتحكم في Arena.ai)
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  browserless:
    image: browserless/chrome:latest
    environment:
      - MAX_CONCURRENT_SESSIONS=3
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=10
      - TOKEN=browserless_token_change_me
    ports:
      - "3000:3000"
    shm_size: 2gb

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password_change_me
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin_password_change_me
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Asia/Riyadh
      # Queue Mode for long-running workflows
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_ENCRYPTION_KEY=change_this_to_random_32_chars_string
      # Allow long workflows (1 week = 168h)
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_TIMEOUT=604800
      - EXECUTIONS_TIMEOUT_MAX=604800
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
      - ./scripts:/home/node/scripts
      # مهم: اربط مجلد مشاريع اندرويد ستوديو
      - ${ANDROID_PROJECTS_PATH:-C:/Users/YourUser/AndroidStudioProjects}:/home/node/android_projects
      - ${ANDROID_SDK_PATH:-C:/Users/YourUser/AppData/Local/Android/Sdk}:/home/node/android_sdk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      browserless:
        condition: service_started
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
  redis_data:
